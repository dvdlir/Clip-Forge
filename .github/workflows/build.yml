name: Build ClipForge AI Windows EXE

on:
  workflow_dispatch:
  push:
    tags:
      - 'v*'

jobs:
  build:
    runs-on: windows-latest
    steps:
      - name: Check out project
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.11'

      - name: Install Python packages
        run: |
          python -m pip install --upgrade pip
          pip install -r requirements.txt pyinstaller

      - name: Download FFmpeg binaries
        shell: pwsh
        run: |
          Invoke-WebRequest -Uri https://www.gyan.dev/ffmpeg/builds/ffmpeg-release-essentials.zip -OutFile ffmpeg.zip
          Expand-Archive ffmpeg.zip -DestinationPath ffmpeg-unpacked
          $bin = Get-ChildItem ffmpeg-unpacked -Directory | Select-Object -First 1
          New-Item -ItemType Directory -Force -Path ffmpeg | Out-Null
          Copy-Item "$($bin.FullName)\bin\ffmpeg.exe" ffmpeg\
          Copy-Item "$($bin.FullName)\bin\ffprobe.exe" ffmpeg\

      - name: Package desktop executable
        shell: pwsh
        run: |
          pyinstaller --noconfirm --clean --onefile --windowed --name ClipForgeAI `
            --add-data "app.py;." `
            --add-data "ffmpeg;ffmpeg" `
            --collect-all streamlit `
            --collect-all faster_whisper `
            --collect-all ctranslate2 `
            --collect-all yt_dlp `
            --collect-all av `
            --collect-all altair `
            --collect-all pyarrow `
            --collect-all watchdog `
            launcher.py

      - name: Upload EXE
        uses: actions/upload-artifact@v4
        with:
          name: ClipForgeAI-Windows
          path: dist/ClipForgeAI.exe
          if-no-files-found: error
